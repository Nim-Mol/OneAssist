name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core logic)
        run: ./gradlew :core:test

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEASSIST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oneassist.p12"
            echo "ONEASSIST_KEYSTORE=$RUNNER_TEMP/oneassist.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key secret set: building a debug APK instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ONEASSIST_KEYSTORE_PASSWORD: ${{ secrets.ONEASSIST_KEYSTORE_PASSWORD }}
          ONEASSIST_KEY_ALIAS: ${{ secrets.ONEASSIST_KEY_ALIAS }}
          ONEASSIST_KEY_PASSWORD: ${{ secrets.ONEASSIST_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk OneAssist.apk

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk OneAssist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OneAssist-apk
          path: OneAssist.apk

      # Only a release-signed APK is published. A debug APK is debuggable (run-as, debugger) and
      # signed with a throwaway key, so it must never become the build installed on the phone.
    outputs:
      signed: ${{ steps.signing.outputs.signed }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OneAssist-apk
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OneAssist (latest build)
          prerelease: true
          make_latest: true
          files: OneAssist.apk
